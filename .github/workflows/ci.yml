name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (race detector on Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/spinup
          done
      - run: sh -n scripts/install.sh
