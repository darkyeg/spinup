name: nightly

# Every night, when main moved since the last release, tag the next patch version and release it, so
# `spinup update` brings merged fixes to every machine without anyone tagging by hand.
# Minor and major versions are still a tag you push yourself.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: nightly

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - id: next
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=v0.1.0
          elif [ -z "$(git rev-list "$last"..HEAD)" ]; then
            echo "main hasn't changed since $last: no nightly"
            exit 0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v$major.$minor.$((${patch%%[-+]*} + 1))"
          fi
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
